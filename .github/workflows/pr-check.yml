name: Build and test app on PRs

on:
  pull_request:
    branches:
      - "*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.0'

      - name: Run PR check script (check formatting, analyze, test and build)
        env:
          BUILD_NUMBER: ${{github.run_number}}
          DGC_BASE_URL: ${{ secrets.DGC_BASE_URL }}
          DGC_API_KEY: ${{ secrets.DGC_API_KEY }}
          # Make sure to add to the s/pr-check script and deploy-testing.yml too
        run: s/pr-check
