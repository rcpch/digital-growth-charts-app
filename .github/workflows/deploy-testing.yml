name: Build app and release to test users (Android & Web)

on:
  push:
    branches: [main] # Or perhaps on: release: types: [published] if you want this for releases
  workflow_dispatch:

permissions:
  id-token: write # For Google Play auth
  contents: write # For committing to repo for GitHub Pages for actions/deploy-pages
  pages: write    # Required for actions/deploy-pages

jobs:
  # ============================
  # ANDROID BUILD AND PUBLISH
  # ============================
  build-and-publish-android:
    runs-on: ubuntu-latest
    name: Build and Publish Android App
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Extract version from pubspec.yaml and set build number (Android)
        id: get_version_android
        run: |
          VERSION_NAME=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          BUILD_NUMBER=$GITHUB_RUN_NUMBER
          echo "Detected Android Version Name: $VERSION_NAME"
          echo "Generated Android Build Number: $BUILD_NUMBER"
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV # Ensure BUILD_NUMBER is set for the build step

      - name: Create dummy .env for CI build (if needed by pubspec.yaml assets)
        run: touch .env

      - name: Run Flutter tests (Android context)
        env:
          DGC_BASE_URL: ${{ secrets.DGC_BASE_URL_ANDROID }} # Use specific secrets if they differ
          DGC_API_KEY: ${{ secrets.DGC_API_KEY_ANDROID }}
        run: |
          DEFINES_TO_PASS=""
          if [ -n "$DGC_BASE_URL" ]; then
            DEFINES_TO_PASS="--dart-define=DGC_BASE_URL=$DGC_BASE_URL $DEFINES_TO_PASS"
          fi
          if [ -n "$DGC_API_KEY" ]; then
            DEFINES_TO_PASS="--dart-define=DGC_API_KEY=$DGC_API_KEY $DEFINES_TO_PASS"
          fi
          echo "Running flutter test with defines: ${DEFINES_TO_PASS}"
          flutter test ${DEFINES_TO_PASS}

      - name: Build Android App Bundle
        env:
          BUILD_NUMBER_ENV: ${{ steps.get_version_android.outputs.BUILD_NUMBER || env.BUILD_NUMBER || github.run_number }} # Prioritize extracted, then env, then GITHUB_RUN_NUMBER
          DGC_BASE_URL: ${{ secrets.DGC_BASE_URL_ANDROID }}
          DGC_API_KEY: ${{ secrets.DGC_API_KEY_ANDROID }}
        run: |
          echo "Using Android Build Number: $BUILD_NUMBER_ENV"
          flutter build appbundle --release \
            --build-name=${{ steps.get_version_android.outputs.VERSION_NAME }} \
            --build-number=${BUILD_NUMBER_ENV} \
            --dart-define=DGC_BASE_URL=${DGC_BASE_URL} \
            --dart-define=DGC_API_KEY=${DGC_API_KEY} # Add other necessary dart-defines

      - name: Decode Android keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > android/keystore.jks

      - name: Decode Android key properties
        run: echo "${{ secrets.ANDROID_KEY_PROPERTIES }}" | base64 --decode > android/key.properties

      - id: authenticate
        name: Authenticate with Google
        uses: google-github-actions/auth@v2
        with:
          service_account: rcpch-growth-charts-app@rcpch-growth-charts-app.iam.gserviceaccount.com # Replace with your actual service account
          workload_identity_provider: projects/221963061860/locations/global/workloadIdentityPools/github/providers/rcpch-growth-charts-app # Replace with your WIF provider
          create_credentials_file: true

      - name: Upload to Internal Test Track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ steps.authenticate.outputs.credentials_file_path }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          packageName: uk.ac.rcpch.digital_growth_charts_app
          track: internal

  # ============================
  # WEB BUILD AND DEPLOY
  # ============================
  build-and-deploy-web:
    runs-on: ubuntu-latest
    name: Build and Deploy Web App to GitHub Pages

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Create dummy .env for CI build (if needed by pubspec.yaml assets)
        run: touch .env

      - name: Run Flutter tests (Web context)
        env:
          DGC_BASE_URL: ${{ secrets.DGC_BASE_URL_WEB }}
          DGC_API_KEY: ${{ secrets.DGC_API_KEY_WEB }}
        run: |
          DEFINES_TO_PASS=""
          if [ -n "$DGC_BASE_URL" ]; then
            DEFINES_TO_PASS="--dart-define=DGC_BASE_URL=$DGC_BASE_URL $DEFINES_TO_PASS"
          fi
          if [ -n "$DGC_API_KEY" ]; then
            DEFINES_TO_PASS="--dart-define=DGC_API_KEY=$DGC_API_KEY $DEFINES_TO_PASS"
          fi
          echo "Running flutter test (web context) with defines: ${DEFINES_TO_PASS}"
          flutter test ${DEFINES_TO_PASS} # Tests can also run in web context if configured

      - name: Build Flutter Web
        env:
          DGC_BASE_URL: ${{ secrets.DGC_BASE_URL_WEB }}
          DGC_API_KEY: ${{ secrets.DGC_API_KEY_WEB }} # Again, be cautious with this on the client-side
        run: |
          FLUTTER_WEB_BUILD_COMMAND="flutter build web --release"
          
          # Add dart-defines for web build
          if [ -n "$DGC_BASE_URL" ]; then
            FLUTTER_WEB_BUILD_COMMAND="$FLUTTER_WEB_BUILD_COMMAND --dart-define=DGC_BASE_URL=$DGC_BASE_URL"
          fi
          if [ -n "$DGC_API_KEY" ]; then
            FLUTTER_WEB_BUILD_COMMAND="$FLUTTER_WEB_BUILD_COMMAND --dart-define=DGC_API_KEY=$DGC_API_KEY"
          fi
          
          echo "Running Web Build: $FLUTTER_WEB_BUILD_COMMAND"
          $FLUTTER_WEB_BUILD_COMMAND

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          # Path to the directory containing the static assets to be deployed.
          # Flutter web builds to 'build/web' by default.
          path: './build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
