<script type="importmap">
{
  "integrity": {
    "https://cdn.jsdelivr.net/npm/oauth4webapi@3.8.2/+esm": "sha384-6MaEX36MZIuIBHn9XGmkOWIKEgNjEKMlAeFLDfnQxhVvgQW4W8rbDGf++fowMIFG"
  }
}
</script>

<script type="module">
  import { fetchConfig, oauthStart, oauthCallback } from './oauth.mjs';

  const config = await fetchConfig();

  const clientId = config['MICROSOFT_LOGIN_CLIENT_ID'];
  let oauthServer = config['MICROSOFT_LOGIN_OAUTH_SERVER'];

  if (!clientId) {
    throw new Error('Missing MICROSOFT_LOGIN_CLIENT_ID in .env');
  }

  if (!oauthServer) {
    throw new Error('Missing MICROSOFT_LOGIN_OAUTH_SERVER in .env');
  }

  console.log(`!! Using OAuth server: ${oauthServer}`);
  oauthServer = new URL(oauthServer);

  const params = new URLSearchParams(window.location.search);

  if (params.has('code')) {
    await oauthCallback(clientId, oauthServer);
  } else {
    await oauthStart(clientId, oauthServer);
  }
</script>
